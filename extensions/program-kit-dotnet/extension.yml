schema_version: "1.0"

extension:
  id: "program-kit-dotnet"
  name: "Program Kit .NET"
  version: "0.12.0"
  description: "Provides the .NET engineering baseline and reviewable managed-file synchronization consumed by repository-level building-block reconciliation."
  author: "Orbyss"
  repository: "https://github.com/orbyss-io/program-kit"
  license: "MIT"
  category: "process"
  effect: "read-write"

requires:
  speckit_version: ">=1.0.1,<2.0.0"

provides:
  commands: []
  scripts:
    - name: "engineering-baseline"
      file: "scripts/dotnet_sync.py"
      description: "Internal managed-file adapter invoked by governance sync."

tags:
  - "dotnet"
  - "architecture"
  - "runtime"
  - "quality"
  - "scaffolding"
