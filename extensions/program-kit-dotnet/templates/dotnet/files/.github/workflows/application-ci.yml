name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up managed Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up managed Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Select managed npm
        shell: bash
        run: npm install --global "npm@$(tr -d '\r\n' < .npm-version)"

      - name: Prepare selected typed frontends
        run: python eng/prepare_hosted_pages.py --repository . --restore

      - name: Run repository verification gate
        shell: pwsh
        run: ./eng/Invoke-RepositoryVerification.ps1 -Mode CI

      - name: Upload application handoff inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-handoff-inputs-${{ github.sha }}
          path: |
            eng/application-handoff.json
            eng/openapi-contracts.json
            docs/application/
            contracts/
            artifacts/program-kit/openapi/
          if-no-files-found: error
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-packages-${{ github.sha }}
          path: artifacts/packages/**/*.nupkg
          if-no-files-found: error
          retention-days: 14
