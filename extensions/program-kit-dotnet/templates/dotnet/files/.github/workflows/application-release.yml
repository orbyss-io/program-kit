name: Application Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up managed Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Verify selected public building blocks
        run: |
          python .specify/extensions/program-kit-building-blocks/scripts/public_availability.py \
            --target . \
            --catalog .specify/extensions/program-kit-building-blocks/references/orbyss-building-blocks.json \
            --evidence artifacts/building-block-public-availability.json

      - name: Verify tag and host image policy
        shell: bash
        env:
          ORBYSS_FOUNDATION_HOST_IMAGE: ${{ vars.ORBYSS_FOUNDATION_HOST_IMAGE }}
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }
          if [[ "$ORBYSS_FOUNDATION_HOST_IMAGE" != *@sha256:* ]]; then
            echo "ORBYSS_FOUNDATION_HOST_IMAGE must name the approved application-neutral host by digest." >&2
            exit 1
          fi
          expected_host="$(jq -r '.artifacts[] | select(.packageKey == "oci:ghcr.io/orbyss-io/foundation-host") | .reference' artifacts/building-block-public-availability.json)"
          [[ -n "$expected_host" ]] || { echo "Accepted building-block selection has no Foundation host." >&2; exit 1; }
          [[ "$ORBYSS_FOUNDATION_HOST_IMAGE" == "$expected_host" ]] || { echo "Configured host digest differs from selected public-availability evidence." >&2; exit 1; }

      - name: Run repository verification gate
        shell: pwsh
        run: ./.program-kit/eng/Invoke-RepositoryVerification.ps1 -Mode Release

      - name: Stage runnable host image
        shell: pwsh
        run: ./.program-kit/eng/Build.ps1 -LockedMode

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish runnable host image
        id: image
        shell: bash
        env:
          ORBYSS_FOUNDATION_HOST_IMAGE: ${{ vars.ORBYSS_FOUNDATION_HOST_IMAGE }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --build-arg "ORBYSS_FOUNDATION_HOST_IMAGE=$ORBYSS_FOUNDATION_HOST_IMAGE" \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file artifacts/image-metadata.json \
            --tag "$image:$GITHUB_REF_NAME" \
            --push .
          digest="$(jq -r '."containerimage.digest"' artifacts/image-metadata.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Build did not return an image digest." >&2; exit 1; }
          echo "repository=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Describe runnable host
        shell: bash
        run: |
          python .program-kit/eng/runnable_host.py describe \
            --repository . \
            --staged artifacts/runnable-host \
            --image "${{ steps.image.outputs.repository }}" \
            --tag "$GITHUB_REF_NAME" \
            --digest "${{ steps.image.outputs.digest }}" \
            --output artifacts/runnable-host.json
          sha256sum artifacts/runnable-host.json > artifacts/runnable-host.json.sha256

      - name: Attest runnable host descriptor
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/runnable-host.json
            artifacts/runnable-host.json.sha256
            artifacts/building-block-public-availability.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/runnable-host.json \
            artifacts/runnable-host.json.sha256 \
            artifacts/building-block-public-availability.json \
            --verify-tag \
            --title "Application $GITHUB_REF_NAME" \
            --generate-notes
