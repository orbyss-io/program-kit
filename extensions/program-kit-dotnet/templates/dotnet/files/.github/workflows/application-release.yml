name: Application Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up managed Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Verify selected public building blocks
        run: |
          python eng/public_availability.py \
            --target . \
            --catalog eng/building-blocks.catalog.json \
            --evidence artifacts/building-block-public-availability.json

      - name: Verify tag and host image policy
        shell: bash
        env:
          ORBYSS_FOUNDATION_HOST_IMAGE: ${{ vars.ORBYSS_FOUNDATION_HOST_IMAGE }}
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }
          if [[ "$ORBYSS_FOUNDATION_HOST_IMAGE" != *@sha256:* ]]; then
            echo "ORBYSS_FOUNDATION_HOST_IMAGE must name the approved application-neutral host by digest." >&2
            exit 1
          fi
          python eng/verify_host_image.py --evidence artifacts/building-block-public-availability.json --reference "$ORBYSS_FOUNDATION_HOST_IMAGE"

      - name: Run repository verification gate
        shell: pwsh
        run: ./eng/Invoke-RepositoryVerification.ps1 -Mode Release

      - name: Stage release bundle
        shell: pwsh
        run: ./eng/Build.ps1 -LockedMode

      - name: Package application release bundle
        shell: bash
        env:
          ORBYSS_FOUNDATION_HOST_IMAGE: ${{ vars.ORBYSS_FOUNDATION_HOST_IMAGE }}
        run: |
          python eng/release_bundle.py describe \
            --repository . \
            --staged artifacts/release-bundle \
            --image "${ORBYSS_FOUNDATION_HOST_IMAGE%@*}" \
            --tag "v$(jq -r '.artifacts[] | select(.packageKey == "oci:ghcr.io/orbyss-io/foundation-host") | .version' artifacts/building-block-public-availability.json)" \
            --digest "${ORBYSS_FOUNDATION_HOST_IMAGE#*@}" \
            --output artifacts/application-bundle.json

      - name: Assemble receiver handoff
        run: python eng/application_handoff.py --repository .

      - name: Attest application release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/application-bundle.json
            artifacts/application-bundle.zip
            artifacts/application-bundle.zip.sha256
            artifacts/building-block-public-availability.json
            artifacts/handoff/index.json
            artifacts/handoff/application-handoff.zip
            artifacts/handoff/application-handoff.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/application-bundle.json \
            artifacts/application-bundle.zip \
            artifacts/application-bundle.zip.sha256 \
            artifacts/building-block-public-availability.json \
            artifacts/handoff/index.json \
            artifacts/handoff/application-handoff.zip \
            artifacts/handoff/application-handoff.zip.sha256 \
            --verify-tag \
            --title "Application $GITHUB_REF_NAME" \
            --generate-notes
