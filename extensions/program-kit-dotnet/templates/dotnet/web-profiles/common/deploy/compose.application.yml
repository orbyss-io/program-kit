name: program-kit-application

services:
  application:
    image: program-kit-consumer:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ProgramKit__Web__ClientSecret: local-program-kit-secret
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "5000:8080"
    healthcheck:
      test: [ "CMD", "dotnet", "ProgramKit.Host.dll", "--program-kit-healthcheck", "http://127.0.0.1:8080/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
