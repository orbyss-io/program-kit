schema_version: "1.0"

extension:
  id: "program-kit-governance"
  name: "Program Kit Governance"
  version: "0.12.11"
  description: "Ratifies governance and enforces modular, architecture-aware Spec Kit delivery."
  author: "Orbyss"
  repository: "https://github.com/orbyss-io/program-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.1.1,<2.0.0"

provides:
  scripts:
    - name: "json-schema"
      file: "scripts/json_schema.py"
      description: "Read-only JSON Schema validation and focused descriptions."
    - name: "schema-runtime"
      file: "scripts/schema_runtime.py"
      description: "Explicit project-local dependency setup and installed-copy checks."
  commands:
    - name: "speckit.program-kit-governance.upgrade"
      file: "commands/speckit.program-kit-governance.upgrade.md"
      description: "Prepare, assess, reconcile and activate an isolated consumer upgrade; pick up scoped migrations and export local evidence."
    - name: "speckit.program-kit-governance.phase-context"
      file: "commands/speckit.program-kit-governance.phase-context.md"
      description: "Project applicable knowledge before planning and task generation."
    - name: "speckit.program-kit-governance.sync"
      file: "commands/speckit.program-kit-governance.sync.md"
      description: "Coordinate phase-specific repository setup, dependency context and readiness."
    - name: "speckit.program-kit-governance.json-schema"
      file: "commands/speckit.program-kit-governance.json-schema.md"
      description: "Validate a JSON file against a schema or inspect a schema section."
    - name: "speckit.program-kit-governance.view-c4"
      file: "commands/speckit.program-kit-governance.view-c4.md"
      description: "Safely inspect and open the generated C4 projection in a pinned localhost viewer."
    - name: "speckit.program-kit-governance.grilling"
      file: "commands/speckit.program-kit-governance.grilling.md"
      description: "Relentlessly stress-test a plan, decision, or idea through a dependency-aware design tree."
    - name: "speckit.program-kit-governance.proxy-intake"
      file: "commands/speckit.program-kit-governance.proxy-intake.md"
      description: "Explicit non-authorizing proxy intake with simulated answers; stop before bootstrap."
    - name: "speckit.program-kit-governance.proxy-bootstrap"
      file: "commands/speckit.program-kit-governance.proxy-bootstrap.md"
      description: "Explicit same-session bootstrap rehearsal with simulated reviews and native validators."
    - name: "speckit.program-kit-governance.specification-intake"
      file: "commands/speckit.program-kit-governance.specification-intake.md"
      description: "Grill and confirm the selected feature before specification creation or updates."
    - name: "speckit.program-kit-governance.ui"
      file: "commands/speckit.program-kit-governance.ui.md"
      description: "Adopt or safely generate the versioned UI, branding and discoverability profile."
    - name: "speckit.program-kit-governance.bootstrap"
      file: "commands/speckit.program-kit-governance.bootstrap.md"
      description: "Use Program Kit grilling to prepare confirmed intake and its C4-aligned domain map, then provide the normal-shell bootstrap command."
    - name: "speckit.program-kit-governance.assessment"
      file: "commands/speckit.program-kit-governance.assessment.md"
      description: "Assess the confirmed intake and create the bootstrap decision baseline."
    - name: "speckit.program-kit-governance.research"
      file: "commands/speckit.program-kit-governance.research.md"
      description: "Research current tools and validate generic guidance against project context."
    - name: "speckit.program-kit-governance.constitution-begin"
      file: "commands/speckit.program-kit-governance.constitution-begin.md"
      description: "Revoke stale ratification evidence before constitution drafting."
    - name: "speckit.program-kit-governance.constitution-ratify"
      file: "commands/speckit.program-kit-governance.constitution-ratify.md"
      description: "Validate and hash-bind constitution ratification after the human gate."
    - name: "speckit.program-kit-governance.constitution-review"
      file: "commands/speckit.program-kit-governance.constitution-review.md"
      description: "Validate a drafted constitution and regenerate its current human review packet."
    - name: "speckit.program-kit-governance.architecture"
      file: "commands/speckit.program-kit-governance.architecture.md"
      description: "Create or update the architecture baseline and ADR system."
    - name: "speckit.program-kit-governance.tooling"
      file: "commands/speckit.program-kit-governance.tooling.md"
      description: "Create a context-sensitive tooling and quality-gate proposal."
    - name: "speckit.program-kit-governance.roadmap"
      file: "commands/speckit.program-kit-governance.roadmap.md"
      description: "Create the governed portfolio of candidate feature specifications."
    - name: "speckit.program-kit-governance.readiness"
      file: "commands/speckit.program-kit-governance.readiness.md"
      description: "Evaluate whether architecture bootstrap is ready for specifications."
    - name: "speckit.program-kit-governance.bootstrap-closure"
      file: "commands/speckit.program-kit-governance.bootstrap-closure.md"
      description: "Close scoped architecture prerequisites with isolated compatibility evidence."
    - name: "speckit.program-kit-governance.bootstrap-recovery"
      file: "commands/speckit.program-kit-governance.bootstrap-recovery.md"
      description: "Recover an accepted bootstrap after technical readiness failure."
    - name: "speckit.program-kit-governance.architecture-check"
      file: "commands/speckit.program-kit-governance.architecture-check.md"
      description: "Check a specification, plan, or implementation for architecture and ADR drift."
    - name: "speckit.program-kit-governance.implementation-check"
      file: "commands/speckit.program-kit-governance.implementation-check.md"
      description: "Apply programming and lifecycle guardrails before implementation."
  config:
    - name: "program-kit-governance-config.yml"
      template: "config/program-kit.template.yml"
      description: "Project-relative locations used to validate ratification, ADRs, and roadmap state."
      required: false

hooks:
  before_constitution:
    command: "speckit.program-kit-governance.constitution-begin"
    priority: 5
    optional: false
    description: "Revoke existing ratification before any constitution draft or amendment."
  after_constitution:
    command: "speckit.program-kit-governance.constitution-review"
    priority: 5
    optional: false
    description: "Validate the current constitution draft and regenerate its review packet before ratification."
  before_specify:
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 5
      enabled: true
      optional: false
      condition: null
      description: "Read applicable architecture and product context before feature intake."
    - command: "speckit.program-kit-governance.specification-intake"
      priority: 10
      enabled: true
      optional: false
      condition: null
      description: "Clarify substantive feature choices; preserve unchanged confirmed intake."
  after_specify:
    - command: "speckit.clarify"
      priority: 5
      enabled: true
      optional: false
      condition: null
      description: "Resolve material specification ambiguity; pause for answers and resume before later hooks."
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 10
      enabled: true
      optional: false
      condition: null
      description: "Present clarified specification conflicts for substantive resolution."
  before_plan:
    command: "speckit.program-kit-governance.phase-context"
    priority: 1
    optional: false
    description: "Apply relevant architecture and coding guidance before design choices."
  after_plan:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Review substantive design conflicts without evidence dossiers."
  before_tasks:
    command: "speckit.program-kit-governance.phase-context"
    priority: 1
    optional: false
    description: "Carry applicable design choices and real tests into tasks."
  after_tasks:
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 1
      optional: false
      description: "Validate the planned compilation graph before affected implementation."
    - command: "speckit.analyze"
      priority: 5
      optional: false
      description: "Use normal Spec Kit consistency analysis."
  before_implement:
    - command: "speckit.program-kit-governance.implementation-check"
      priority: 1
      optional: false
      description: "Supply focused implementation guidance and validate planned architecture once without building."
  after_implement:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Distinguish progress from feature closure/formal handoff; require complete engineering acceptance only at delivery."

tags:
  - "architecture"
  - "adr"
  - "governance"
  - "quality"
  - "bootstrap"
  - "vertical-slicing"
  - "modularity"
