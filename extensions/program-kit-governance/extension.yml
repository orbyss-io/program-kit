schema_version: "1.0"

extension:
  id: "program-kit-governance"
  name: "Program Kit Governance"
  version: "1.0.0-preview.1"
  description: "Contributes focused knowledge, architecture review and engineering guidance to native Spec Kit delivery."
  author: "Orbyss"
  repository: "https://github.com/orbyss-io/program-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.1.1,<2.0.0"

provides:
  scripts:
    - name: "product-intake"
      file: "scripts/product_intake.py"
      description: "Inspect readable product context without approval receipts or lifecycle authority."
    - name: "coding-scaffold"
      file: "scripts/coding_scaffold.py"
      description: "Preview/apply a finite qualified coding recipe; preserve consumer source and native ownership."
    - name: "coding-patterns"
      file: "scripts/coding_patterns.py"
      description: "Prepare pattern drafts and inspect/bind ordinary scoped evidence without executing submissions."
    - name: "json-schema"
      file: "scripts/json_schema.py"
      description: "Read-only JSON Schema validation and focused descriptions."
    - name: "schema-runtime"
      file: "scripts/schema_runtime.py"
      description: "Explicit project-local dependency setup and installed-copy checks."
  commands:
    - name: "speckit.program-kit-governance.product-intake"
      file: "commands/speckit.program-kit-governance.product-intake.md"
      description: "Found or resume a product, review its connected decisions and continue directly to feature intake."
    - name: "speckit.program-kit-governance.coding-scaffold"
      file: "commands/speckit.program-kit-governance.coding-scaffold.md"
      description: "Realize a selected qualified pattern through inspectable native source recipes."
    - name: "speckit.program-kit-governance.coding-patterns"
      file: "commands/speckit.program-kit-governance.coding-patterns.md"
      description: "Assist shared/private pattern authoring through the existing coding context and normal verification owners."
    - name: "speckit.program-kit-governance.repair-request"
      file: "commands/speckit.program-kit-governance.repair-request.md"
      description: "Prepare repair observations, queue local evidence, review public issue/fork submissions and retrieve fresh status."
    - name: "speckit.program-kit-governance.upgrade"
      file: "commands/speckit.program-kit-governance.upgrade.md"
      description: "Prepare, assess, reconcile and activate an isolated consumer upgrade; pick up scoped migrations and export local evidence."
    - name: "speckit.program-kit-governance.phase-context"
      file: "commands/speckit.program-kit-governance.phase-context.md"
      description: "Project applicable knowledge before planning and task generation."
    - name: "speckit.program-kit-governance.sync"
      file: "commands/speckit.program-kit-governance.sync.md"
      description: "Coordinate phase-specific repository setup, dependency context and readiness."
    - name: "speckit.program-kit-governance.json-schema"
      file: "commands/speckit.program-kit-governance.json-schema.md"
      description: "Validate a JSON file against a schema or inspect a schema section."
    - name: "speckit.program-kit-governance.view-c4"
      file: "commands/speckit.program-kit-governance.view-c4.md"
      description: "Safely inspect and open the generated C4 projection in a pinned localhost viewer."
    - name: "speckit.program-kit-governance.grilling"
      file: "commands/speckit.program-kit-governance.grilling.md"
      description: "Relentlessly stress-test a plan, decision, or idea through a dependency-aware design tree."
    - name: "speckit.program-kit-governance.proxy-intake"
      file: "commands/speckit.program-kit-governance.proxy-intake.md"
      description: "Explicit non-authorizing proxy intake with simulated answers; stop before bootstrap."
    - name: "speckit.program-kit-governance.specification-intake"
      file: "commands/speckit.program-kit-governance.specification-intake.md"
      description: "Grill and confirm the selected feature before specification creation or updates."
    - name: "speckit.program-kit-governance.ui"
      file: "commands/speckit.program-kit-governance.ui.md"
      description: "Design connected consumer UI prototypes, research components, or adopt the production UI profile."
    - name: "speckit.program-kit-governance.architecture"
      file: "commands/speckit.program-kit-governance.architecture.md"
      description: "Create or update the architecture baseline and ADR system."
    - name: "speckit.program-kit-governance.readiness"
      file: "commands/speckit.program-kit-governance.readiness.md"
      description: "Inspect current product context and the next useful action."
    - name: "speckit.program-kit-governance.architecture-check"
      file: "commands/speckit.program-kit-governance.architecture-check.md"
      description: "Review actual design alternatives, source facts, contracts and implementation; resolve consequential choices."
    - name: "speckit.program-kit-governance.implementation-check"
      file: "commands/speckit.program-kit-governance.implementation-check.md"
      description: "Apply selected decisions and focused coding guidance to the next coherent implementation increment."
  config:
    - name: "program-kit-governance-config.yml"
      template: "config/program-kit.template.yml"
      description: "Project-relative locations used to validate ratification, ADRs, and roadmap state."
      required: false

hooks:
  before_specify:
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 5
      enabled: true
      optional: false
      condition: null
      description: "Read applicable architecture and product context before feature intake."
    - command: "speckit.program-kit-governance.specification-intake"
      priority: 10
      enabled: true
      optional: false
      condition: null
      description: "Clarify substantive feature choices; preserve unchanged confirmed intake."
  after_specify:
    - command: "speckit.clarify"
      priority: 5
      enabled: true
      optional: false
      condition: null
      description: "Resolve material specification ambiguity; pause for answers and resume before later hooks."
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 10
      enabled: true
      optional: false
      condition: null
      description: "Present clarified specification conflicts for substantive resolution."
  before_plan:
    command: "speckit.program-kit-governance.phase-context"
    priority: 1
    optional: false
    description: "Apply relevant architecture and coding guidance before design choices."
  after_plan:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Review actual design, research, alternatives and checks; resolve material choices and resume native planning."
  before_tasks:
    command: "speckit.program-kit-governance.phase-context"
    priority: 1
    optional: false
    description: "Carry applicable design choices and real tests into tasks."
  after_tasks:
    - command: "speckit.program-kit-governance.architecture-check"
      priority: 1
      optional: false
      description: "Review task coverage of selected responsibilities, methods, dependencies and focused checks."
    - command: "speckit.analyze"
      priority: 5
      optional: false
      description: "Report native read-only consistency findings before any authorized correction."
  before_implement:
    - command: "speckit.program-kit-governance.implementation-check"
      priority: 1
      optional: false
      description: "Read the selected task, decisions, source and focused guidance; prepare a coherent increment and its checks."
  after_implement:
    command: "speckit.program-kit-governance.architecture-check"
    priority: 5
    optional: false
    description: "Review actual implementation and consequential findings; preserve human pauses and run full acceptance at delivery."

tags:
  - "architecture"
  - "adr"
  - "governance"
  - "quality"
  - "bootstrap"
  - "vertical-slicing"
  - "modularity"
