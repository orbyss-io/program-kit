name: Update dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
  packages: read
concurrency:
  group: dependency-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - name: Check dedicated maintenance App configuration
        env:
          APP_CLIENT_ID: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
        run: |
          python -c "import os; missing=[name for name in ('APP_CLIENT_ID','APP_PRIVATE_KEY') if not os.environ.get(name)]; assert not missing, 'Configure DEPENDENCY_UPDATES_APP_CLIENT_ID and DEPENDENCY_UPDATES_APP_PRIVATE_KEY for the repository-scoped maintenance App; see docs/maintenance/dependency-review.md. The built-in GITHUB_TOKEN cannot push workflow updates.'"
      - name: Upgrade active external pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dependency_maintenance.py upgrade
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: extensions/program-kit-dotnet/templates/dotnet/files/global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: extensions/program-kit-dotnet/templates/dotnet/files/.nvmrc
      - name: Select upgraded npm and Spec Kit
        run: |
          npm install --global "npm@$(cat extensions/program-kit-dotnet/templates/dotnet/files/.npm-version)" --ignore-scripts --no-audit --no-fund
          python -c "import re, subprocess, sys; from pathlib import Path; pins=set(re.findall(r'specify-cli==([0-9.]+)', Path('.github/workflows/qualify-candidate.yml').read_text())); assert len(pins)==1, 'CI must select one exact Spec Kit pin'; subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', 'specify-cli=='+pins.pop()], check=True)"
      - name: Prepare schema runtime for the upgraded Python and requirements
        run: python extensions/program-kit-governance/scripts/schema_runtime.py setup
      - name: Qualify and promote the new profile and publisher knowledge
        env:
          GH_TOKEN: ${{ github.token }}
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
        run: python scripts/update_dependency_profiles.py update --engines=chromium,firefox,webkit
      - name: Refresh locks and validate affected capabilities
        env:
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
        run: python scripts/update_dependencies.py --refresh-locks
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.0
      - name: Scan the actual qualified public Host
        run: python scripts/dependency_maintenance.py scan --image "$(python scripts/dependency_maintenance.py host-image)"
      - name: Create repository-scoped maintenance token
        id: maintenance-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open the tested maintenance pull request
        env:
          GH_TOKEN: ${{ steps.maintenance-app.outputs.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          gh auth setup-git --hostname github.com
          branch="codex/dependencies-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update dependencies, qualified profile and versioned publisher knowledge"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Update dependencies and default profile" --body "Upgraded active tooling and packages, refreshed native locks, qualified and promoted the public profile and its publisher knowledge, validated affected capabilities and scanned both Host platforms. Evidence is attached to this workflow run. The dedicated App triggers normal PR package CI; review its result before merging. This PR grants no release publication authority."
      - name: Preserve update evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-update-${{ github.run_id }}
          path: |
            artifacts/dependency-update*.json
            artifacts/dependency-update-tests/
            artifacts/dependency-security/
            artifacts/profile-update-native/
            artifacts/published-forms-browser/
            artifacts/bootstrap-runtime/
            artifacts/validation-runs/
            artifacts/tests/toolkit-cases/
            artifacts/t/**/stdout.log
            artifacts/t/**/stderr.log
            artifacts/t/**/process.json
            artifacts/t/**/result.json
            artifacts/t/**/results.json
            artifacts/t/**/authentication.xml
            artifacts/postgresql-lifecycle/**/*.log
            artifacts/postgresql-lifecycle/**/results.json
            artifacts/tests/typed-operation/**/*.log
            artifacts/tests/typed-operation/**/results.json
            artifacts/tests/hosted-palette/**/*.log
            artifacts/tests/hosted-palette/**/result.json
            artifacts/tests/hosted-palette/**/progress.json
            artifacts/tests/hosted-palette/**/phase.json
            artifacts/tests/reusable-foundations/**/*.log
            artifacts/tests/reusable-foundations/**/*.json
            artifacts/consumer-provider-runtime/
            artifacts/tests/numeric-schema/**/*.log
            extensions/program-kit-building-blocks/references/dependency-profiles/
            extensions/program-kit-building-blocks/references/orbyss-building-blocks.json
            !artifacts/**/cache/nuget/http/**
