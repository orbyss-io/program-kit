name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"

      - name: Set up pinned npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag $GITHUB_REF_NAME does not match $expected." >&2; exit 1; }

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.0.1"

      - name: Prepare project-local JSON Schema runtime
        run: python extensions/program-kit-governance/scripts/schema_runtime.py setup

      - name: Set up managed .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: extensions/program-kit-dotnet/templates/dotnet/files/global.json

      - name: Run shared deterministic inventory and write its receipt
        env:
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
        run: python scripts/run_validation.py --suite Release --approved --receipt --engines=chromium,firefox,webkit

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ github.sha }}
          path: artifacts/validation-runs/
          if-no-files-found: warn

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.cmd
            artifacts/*.sh
            artifacts/SHA256SUMS
            artifacts/release-receipt-*.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(artifacts/*.zip artifacts/*.cmd artifacts/*.sh artifacts/SHA256SUMS artifacts/release-receipt-*.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          elif ! gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "Program Kit $GITHUB_REF_NAME" --generate-notes; then
            for attempt in {1..12}; do
              if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                exit 0
              fi
              sleep 5
            done
            echo "release creation failed and no concurrent release became visible" >&2
            exit 1
          fi

      - name: Validate public installation and upgrade
        run: |
          python tests/validate_public_install.py
          python tests/validate_public_upgrade.py

      - name: Report partial publication after a failed public smoke test
        if: failure()
        run: echo "If the publication step succeeded, assets are already public. Preserve this run and follow failed-release recovery; do not silently move the tag." >> "$GITHUB_STEP_SUMMARY"
