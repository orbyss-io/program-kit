name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)." >&2
            exit 1
          fi

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.0.1"

      - name: Validate extension and workflow
        run: python tests/validate_components.py

      - name: Validate governance-state transitions
        run: python tests/validate_governance_state.py

      - name: Validate bundle manifest
        run: specify bundle validate --path . --offline

      - name: Build release assets
        run: python scripts/build_release.py

      - name: Test packaged extension and workflow
        run: python tests/validate_release_install.py

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.zip \
            artifacts/SHA256SUMS \
            --verify-tag \
            --title "Program Kit $GITHUB_REF_NAME" \
            --generate-notes

      - name: Test live public catalog installation
        run: python tests/validate_public_install.py

      - name: Test live public catalog upgrade from v0.2.0
        run: python tests/validate_public_upgrade.py
