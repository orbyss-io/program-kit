name: Release
run-name: Publish ${{ inputs.expected_commit }} from packages ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact qualified main commit, matching the dispatch source
        required: true
        type: string
      run_id:
        description: Successful Qualify candidate run for that exact commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: publication
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      payload: ${{ steps.identity.outputs.payload }}
      security_at: ${{ steps.identity.outputs.security_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Require exact main source and configured human approval
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python scripts/release_candidate.py assert-main --expected-commit "$EXPECTED_COMMIT"
          python scripts/release_candidate.py assert-environment
      - name: Inspect successful candidate and immutable package bytes
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: python scripts/release_candidate.py verify-promotion --run-id "$RUN_ID" --output artifacts/promotion
      - name: Check candidate security freshness
        id: security
        run: python scripts/release_candidate.py security-status --directory artifacts/promotion
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.security.outputs.fresh != 'true'
        with:
          version: v0.76.0
      - name: Retain current security or refresh only an expired scan
        run: python scripts/release_candidate.py ensure-security --directory artifacts/promotion --output artifacts/security
      - name: Present concrete publication decision
        id: identity
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = json.loads(pathlib.Path('artifacts/promotion/promotion.json').read_text())
          tag = 'v' + p['source']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tag=' + tag + '\n')
              out.write('payload=' + p['payloadSha256'] + '\n')
              out.write('security_at=' + json.loads(pathlib.Path('artifacts/security/security.json').read_text())['observedAt'] + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Publication approval\n\nApprove **' + tag + '** at **' + p['source']['commit'] + '**.\n\n')
              out.write('Package run: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + str(p['runId']) + '\n\n')
              out.write('Windows/Linux package installation and current Host security scan passed. Review the PR validation summary and its disclosed behavioral gaps before approving. Local behavioral execution is maintainer reported.\n\n')
              for asset in p['assets']:
                  out.write('- `' + asset['name'] + '` — `' + asset['sha256'] + '`\n')
              out.write('\nApproval accepts those validation claims and limitations, creates the inspected version tag, authorizes publication of these exact bytes, and verifies the real explicitly tagged public initializer.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inspection-${{ github.run_attempt }}
          path: |
            artifacts/promotion/
            artifacts/security/
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: inspect
    environment:
      name: publication
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Prepare actual public installer prerequisites
        run: python -m pip install --disable-pip-version-check "specify-cli==1.2.1"
      - name: Recheck inspected source after approval
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python scripts/release_candidate.py assert-main --expected-commit "$EXPECTED_COMMIT"
      - name: Retrieve exactly the approved candidate
        env:
          RUN_ID: ${{ inputs.run_id }}
          EXPECTED_PAYLOAD: ${{ needs.inspect.outputs.payload }}
          SECURITY_AT: ${{ needs.inspect.outputs.security_at }}
        run: python scripts/release_candidate.py verify-promotion --run-id "$RUN_ID" --output artifacts/promotion --expected-payload "$EXPECTED_PAYLOAD" --security-observed-at "$SECURITY_AT"
      - name: Create inspected tag after human approval
        env:
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
        run: python scripts/publish_candidate.py --tag "$RELEASE_TAG" --directory artifacts/promotion --create-tag
      - name: Publish inspected bytes without rebuilding
        env:
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
        run: python scripts/publish_candidate.py --tag "$RELEASE_TAG" --directory artifacts/promotion
      - name: Verify public bytes
        env:
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
        run: python scripts/publish_candidate.py --tag "$RELEASE_TAG" --directory artifacts/promotion --verify-public-only
      - name: Verify actual explicitly tagged public initializer
        run: python tests/validate_public_delivery.py --directory artifacts/promotion --budget-seconds 120
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-delivery-${{ github.run_attempt }}
          path: artifacts/public-delivery/
          if-no-files-found: warn
          retention-days: 14
      - name: Report partial publication after failure
        if: failure()
        run: echo "Preserve this run and inspect public tags and assets before recovery. Never overwrite differing bytes or silently move a stable tag." >> "$GITHUB_STEP_SUMMARY"
