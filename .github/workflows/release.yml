name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"

      - name: Set up pinned npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag $GITHUB_REF_NAME does not match $expected." >&2; exit 1; }

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.0.1"

      - name: Prepare project-local JSON Schema runtime
        run: python extensions/program-kit-governance/scripts/schema_runtime.py setup

      - name: Validate AI extension
        run: |
          python tests/validate_components.py
          python tests/validate_test_suites.py
          python tests/validate_specification_intake.py
          python tests/validate_intake_session.py
          python tests/validate_intake_authoring.py
          python tests/validate_json_schema.py
          python tests/validate_ui_experience.py
          python tests/validate_orbyss_building_blocks.py
          python tests/validate_building_blocks.py
          python tests/validate_building_block_availability.py
          python tests/validate_legacy_programkit_nuget.py
          python tests/validate_governance_state.py
          python tests/validate_local_upgrade.py
          python tests/validate_bootstrap_context.py
          python tests/validate_architecture_placement.py
          python tests/validate_bootstrap_lifecycle.py
          python tests/validate_bootstrap_intake.py
          python tests/validate_bootstrap_semantics.py
          python tests/validate_c4_view.py
          python tests/validate_live_bootstrap_acceptance.py
          python tests/validate_lifecycle_profiles.py
          python tests/validate_js_toolchain.py
          python tests/validate_dotnet_scaffold.py
          python tests/validate_dotnet_build_contract.py
          python tests/validate_dotnet_test_discovery.py
          python tests/validate_repository_verification_hook.py
          python tests/validate_generated_contract_schemas.py
          python tests/validate_codex_bootstrap.py

      - name: Validate UI accessibility, keyboard, and analytics
        run: python tests/validate_ui_browser.py --install --install-browser --engines=chromium,firefox,webkit

      - name: Validate and build Program Kit release assets
        run: |
          specify bundle validate --path . --offline
          python scripts/build_release.py
          python tests/validate_bootstrap_consistency_e2e.py
          python tests/validate_packaged_ui.py
          python tests/validate_release_install.py
          python tests/validate_public_upgrade.py --candidate-dir artifacts

      - name: Verify complete public building-block catalog
        env:
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
        run: |
          python extensions/program-kit-building-blocks/scripts/public_availability.py \
            --target . \
            --catalog extensions/program-kit-building-blocks/references/orbyss-building-blocks.json \
            --all \
            --evidence artifacts/building-block-public-availability.json

      - name: Write deterministic Release receipt
        run: python scripts/write_release_receipt.py --browser-engines chromium,firefox,webkit

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.cmd
            artifacts/*.sh
            artifacts/SHA256SUMS
            artifacts/release-receipt-*.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(artifacts/*.zip artifacts/*.cmd artifacts/*.sh artifacts/SHA256SUMS artifacts/release-receipt-*.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          elif ! gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "Program Kit $GITHUB_REF_NAME" --generate-notes; then
            for attempt in {1..12}; do
              if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                exit 0
              fi
              sleep 5
            done
            echo "release creation failed and no concurrent release became visible" >&2
            exit 1
          fi

      - name: Validate public installation and upgrade
        run: |
          python tests/validate_public_install.py
          python tests/validate_public_upgrade.py
