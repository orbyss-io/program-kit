name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  actions: read
  packages: read
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Prepare publication and public installation tools
        run: |
          python -m pip install --disable-pip-version-check "specify-cli==1.2.0"
          python extensions/program-kit-governance/scripts/schema_runtime.py setup
      - name: Resolve exact qualified source; verify trust, payload, security and readiness
        shell: bash
        run: |
          run_id=$(python scripts/release_candidate.py find)
          python scripts/release_candidate.py verify-promotion --run-id "$run_id" --output artifacts/promotion --tag "$GITHUB_REF_NAME"
      - name: Attest publication of previously built assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/promotion/payload/*
      - name: Publish exactly the qualified GitHub assets and supplemental assessment
        run: python scripts/publish_candidate.py --tag "$GITHUB_REF_NAME" --directory artifacts/promotion
      - name: Validate newly public installation and upgrade
        env:
          PROGRAM_KIT_PUBLIC_REF: ${{ github.ref_name }}
        run: |
          python tests/validate_public_install.py
          python tests/validate_public_upgrade.py
          python scripts/publish_candidate.py --tag "$GITHUB_REF_NAME" --directory artifacts/promotion --verify-public-only
      - name: Preserve promotion diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/promotion/promotion.json
            artifacts/promotion/qualification/
            artifacts/promotion/assessments/
            artifacts/promotion/security-history/
          if-no-files-found: warn
          retention-days: 14
      - name: Report partial publication after failure
        if: failure()
        run: echo "If assets became public, preserve this run, disclose partial publication and require exact corrected-commit/same-tag approval. Never clobber differing assets or silently move a tag." >> "$GITHUB_STEP_SUMMARY"
