name: Retire ProgramKit NuGet packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UNLIST ALL PROGRAMKIT PACKAGES after both replacement releases succeed
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  unlist:
    runs-on: ubuntu-latest
    environment: nuget-retirement
    steps:
      - name: Check out the approved migration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Authenticate with NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Verify replacements and unlist legacy package versions
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RETIREMENT_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          python scripts/retire_programkit_nuget.py
          --verify-public
          --execute
          --confirmation "$RETIREMENT_CONFIRMATION"
