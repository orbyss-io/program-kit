name: Publish Program Kit NuGet Packages

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }

      - name: Build packages
        run: |
          dotnet restore ProgramKit.slnx --locked-mode
          dotnet build ProgramKit.slnx -c Release --no-restore
          dotnet pack ProgramKit.slnx -c Release --no-build -p:PackageOutputPath="$PWD/artifacts/nuget"

      - name: Attest packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/nuget/*.nupkg

      - name: Publish packages when authentication is configured
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY is not configured; packages were built and attested but not published."
            exit 0
          fi
          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
