name: Publish verified Program Kit packages

on:
  workflow_dispatch:
    inputs:
      canonical_run_id:
        description: Exact successful Program Kit integration run ID from a push to main
        required: true
        type: string

concurrency:
  group: program-kit-nuget-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected canonical build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      run-id: ${{ steps.selection.outputs.run-id }}
      source-commit: ${{ steps.selection.outputs.source-commit }}
      artifact-id: ${{ steps.selection.outputs.artifact-id }}
      artifact-name: ${{ steps.selection.outputs.artifact-name }}
      product-version: ${{ steps.canonical-build.outputs.product-version }}
    env:
      INTEGRATION_WORKFLOW: .github/workflows/program-kit-integration.yml
      INTEGRATION_PROFILE_IDENTITY: pkid:profile:program-kit:private-csharp-gate-exhaustive
      INTEGRATION_PROFILE_VERSION: 1.0.1
      INTEGRATION_PROFILE_DIGEST: sha256:2e383f220030e2933dca3e7af27543e73a28451506c183538d6d84aba689791f
      SELECTED_SOURCE_ROOT: ${{ github.workspace }}/selected-source
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a main-branch manual dispatch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Package publication must be dispatched from main.'
          }

      - name: Check out the registered publication workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read and verify the exact selected run
        id: selection
        shell: pwsh
        run: |
          $runId = '${{ inputs.canonical_run_id }}'
          if ($runId -cnotmatch '^[1-9][0-9]*$') {
            throw 'canonical_run_id must be one exact positive numeric run ID.'
          }

          $metadataRoot = Join-Path $env:RUNNER_TEMP 'canonical-build-metadata'
          New-Item -ItemType Directory -Path $metadataRoot | Out-Null
          $runPath = Join-Path $metadataRoot 'run.json'
          $artifactsPath = Join-Path $metadataRoot 'artifacts.json'
          $runJson = gh api `
            -H 'Accept: application/vnd.github+json' `
            "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read selected run $runId."
          }
          [IO.File]::WriteAllText($runPath, "$runJson`n")
          $artifactsJson = gh api `
            -H 'Accept: application/vnd.github+json' `
            "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read artifacts for selected run $runId."
          }
          [IO.File]::WriteAllText($artifactsPath, "$artifactsJson`n")

          $selectionJson = pwsh -NoProfile `
            -File build/Test-ProgramKitCanonicalBuildRun.ps1 `
            -RunMetadataPath $runPath `
            -ArtifactMetadataPath $artifactsPath `
            -Repository $env:GITHUB_REPOSITORY `
            -RunId $runId `
            -WorkflowIdentity $env:INTEGRATION_WORKFLOW
          if ($LASTEXITCODE -ne 0) {
            throw "Selected run $runId is ineligible."
          }
          $selection = $selectionJson | ConvertFrom-Json
          "run-id=$($selection.runId)" >> $env:GITHUB_OUTPUT
          "source-commit=$($selection.sourceCommit)" >> $env:GITHUB_OUTPUT
          "artifact-id=$($selection.artifactId)" >> $env:GITHUB_OUTPUT
          "artifact-name=$($selection.artifactName)" >> $env:GITHUB_OUTPUT

      - name: Require the selected commit in current main history
        shell: pwsh
        run: |
          git merge-base --is-ancestor `
            '${{ steps.selection.outputs.source-commit }}' `
            HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'The selected canonical-build commit is not in current main history.'
          }

      - name: Check out the selected source manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.selection.outputs.source-commit }}
          path: selected-source
          sparse-checkout: build/program-kit-release-packages.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the exact artifact ID
        env:
          CANONICAL_BUILD_ROOT: ${{ runner.temp }}/program-kit-canonical-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact-id }}
          path: ${{ env.CANONICAL_BUILD_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.selection.outputs.run-id }}
          digest-mismatch: error

      - name: Verify internal provenance and exact package bytes
        env:
          CANONICAL_BUILD_ROOT: ${{ runner.temp }}/program-kit-canonical-build
        id: canonical-build
        shell: pwsh
        run: |
          $resultJson = pwsh -NoProfile `
            -File build/Test-ProgramKitCanonicalBuild.ps1 `
            -CanonicalBuildRoot "$env:CANONICAL_BUILD_ROOT" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -Event push `
            -Branch refs/heads/main `
            -SourceCommit '${{ steps.selection.outputs.source-commit }}' `
            -WorkflowIdentity "$env:INTEGRATION_WORKFLOW" `
            -WorkflowRevision '${{ steps.selection.outputs.source-commit }}' `
            -RunId '${{ steps.selection.outputs.run-id }}' `
            -ArtifactName '${{ steps.selection.outputs.artifact-name }}' `
            -ProfileIdentity "$env:INTEGRATION_PROFILE_IDENTITY" `
            -ProfileVersion "$env:INTEGRATION_PROFILE_VERSION" `
            -ProfileSha256 "$env:INTEGRATION_PROFILE_DIGEST" `
            -SourceRepositoryRoot "$env:SELECTED_SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) {
            throw 'Canonical-build package evidence verification failed.'
          }
          $result = $resultJson | ConvertFrom-Json
          "product-version=$($result.productVersion)" >> $env:GITHUB_OUTPUT

      - name: Verify exact signer workflow attestations
        env:
          CANONICAL_BUILD_ROOT: ${{ runner.temp }}/program-kit-canonical-build
        shell: pwsh
        run: |
          $manifest = Get-Content `
            -Raw `
            -LiteralPath "$env:CANONICAL_BUILD_ROOT/package-manifest.json" |
            ConvertFrom-Json
          $subjects = @(
            $manifest.packages |
              ForEach-Object {
                Join-Path "$env:CANONICAL_BUILD_ROOT/feed" $_.filename
              })
          $subjects += @(
            "$env:CANONICAL_BUILD_ROOT/package-manifest.json",
            "$env:CANONICAL_BUILD_ROOT/SHA256SUMS",
            "$env:CANONICAL_BUILD_ROOT/canonical-build-provenance.json")
          foreach ($subject in $subjects) {
            gh attestation verify $subject `
              --repo "$env:GITHUB_REPOSITORY" `
              --signer-workflow "$env:GITHUB_REPOSITORY/$env:INTEGRATION_WORKFLOW" `
              --signer-digest '${{ steps.selection.outputs.source-commit }}' `
              --source-digest '${{ steps.selection.outputs.source-commit }}' `
              --source-ref refs/heads/main `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "Attestation verification failed: $subject"
            }
          }

  publish:
    name: Publish exact verified package bytes
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    environment: program-kit-publication
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      INTEGRATION_WORKFLOW: .github/workflows/program-kit-integration.yml
      INTEGRATION_PROFILE_IDENTITY: pkid:profile:program-kit:private-csharp-gate-exhaustive
      INTEGRATION_PROFILE_VERSION: 1.0.1
      INTEGRATION_PROFILE_DIGEST: sha256:2e383f220030e2933dca3e7af27543e73a28451506c183538d6d84aba689791f
      SELECTED_SOURCE_ROOT: ${{ github.workspace }}/selected-source
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the registered publication workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the selected commit in current main history
        shell: pwsh
        run: |
          git merge-base --is-ancestor `
            '${{ needs.verify.outputs.source-commit }}' `
            HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'The selected canonical-build commit is not in current main history.'
          }

      - name: Check out the selected source manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source-commit }}
          path: selected-source
          sparse-checkout: build/program-kit-release-packages.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up the repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the same exact artifact ID
        env:
          CANONICAL_BUILD_ROOT: ${{ runner.temp }}/program-kit-canonical-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ env.CANONICAL_BUILD_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify.outputs.run-id }}
          digest-mismatch: error

      - name: Reverify immutable bytes inside the protected job
        env:
          CANONICAL_BUILD_ROOT: ${{ runner.temp }}/program-kit-canonical-build
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/Test-ProgramKitCanonicalBuild.ps1 `
            -CanonicalBuildRoot "$env:CANONICAL_BUILD_ROOT" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -Event push `
            -Branch refs/heads/main `
            -SourceCommit '${{ needs.verify.outputs.source-commit }}' `
            -WorkflowIdentity "$env:INTEGRATION_WORKFLOW" `
            -WorkflowRevision '${{ needs.verify.outputs.source-commit }}' `
            -RunId '${{ needs.verify.outputs.run-id }}' `
            -ArtifactName '${{ needs.verify.outputs.artifact-name }}' `
            -ProfileIdentity "$env:INTEGRATION_PROFILE_IDENTITY" `
            -ProfileVersion "$env:INTEGRATION_PROFILE_VERSION" `
            -ProfileSha256 "$env:INTEGRATION_PROFILE_DIGEST" `
            -SourceRepositoryRoot "$env:SELECTED_SOURCE_ROOT"

      - name: Fail on an existing tag or release
        shell: pwsh
        run: |
          $tag = 'v${{ needs.verify.outputs.product-version }}'
          $refsJson = gh api `
            "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check tag collision for $tag."
          }
          if (@(
              $refsJson |
                ConvertFrom-Json |
                Where-Object { $_.ref -ceq "refs/tags/$tag" }).Count -ne 0) {
            throw "Tag already exists: $tag"
          }
          $releasePagesJson = gh api `
            --paginate `
            --slurp `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check release collision for $tag."
          }
          $releasePages = @($releasePagesJson | ConvertFrom-Json)
          $releases = @($releasePages | ForEach-Object { $_ })
          if (@(
              $releases |
                Where-Object { $_.tag_name -ceq $tag }).Count -ne 0) {
            throw "Release already exists: $tag"
          }

      - name: Request a temporary NuGet credential
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish exact bytes and create matching durable assets
        shell: pwsh
        env:
          CANONICAL_BUILD_ROOT: ${{ runner.temp }}/program-kit-canonical-build
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          pwsh -NoProfile -File build/Publish-ProgramKitCanonicalBuild.ps1 `
            -CanonicalBuildRoot "$env:CANONICAL_BUILD_ROOT" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -SourceCommit '${{ needs.verify.outputs.source-commit }}' `
            -ProductVersion '${{ needs.verify.outputs.product-version }}'
