name: Refresh candidate security
run-name: Refresh candidate security ${{ inputs.expected_commit }} ${{ inputs.candidate }}
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      run_id:
        description: Complete original qualification run
        required: true
        type: string
      candidate:
        description: SHA256 of authenticated qualification.json
        required: true
        type: string
      supersedes:
        description: Comma-separated failed run/attempt identities explicitly repaired
        required: false
        type: string
permissions:
  contents: read
  packages: read
  actions: read
  attestations: write
  id-token: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Assert exact candidate in trusted main recorder
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python scripts/release_candidate.py assert-recorder --expected-commit "$EXPECTED_COMMIT"
        shell: bash
      - run: python -m pip install --disable-pip-version-check "specify-cli==1.2.0"
      - run: python extensions/program-kit-governance/scripts/schema_runtime.py setup
      - name: Read configurable retention policy
        shell: bash
        run: python -c "import json,os; open(os.environ['GITHUB_ENV'],'a').write('RETENTION_DAYS=' + str(json.load(open('release-policy.json'))['artifactRetentionDays']) + '\n')"
      - name: Verify the complete unchanged candidate
        env:
          RUN_ID: ${{ inputs.run_id }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python scripts/release_candidate.py download --run-id "$RUN_ID" --output artifacts/verified --candidate "$CANDIDATE"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      - name: Record passing or failing scan; no package build or product tests
        id: scan
        continue-on-error: true
        env:
          CANDIDATE: ${{ inputs.candidate }}
          SUPERSEDES: ${{ inputs.supersedes }}
        run: python scripts/release_candidate.py security --payload-manifest artifacts/verified/payload/candidate-payload.json --candidate "$CANDIDATE" --supersedes "$SUPERSEDES" --output artifacts/record
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/record/security.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ github.run_attempt }}
          path: artifacts/record/
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
      - name: Report failed security qualification after preserving authenticated evidence
        if: steps.scan.outcome != 'success'
        run: exit 1
