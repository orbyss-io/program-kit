name: Vertical slice

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Bootstrap exact dependency mirror
        shell: pwsh
        run: ./eng/Bootstrap-DependencyMirror.ps1
      - name: Restore locked repository graph
        run: dotnet restore ProgramKit.slnx --locked-mode --configfile NuGet.Config
      - name: Build release
        run: dotnet build ProgramKit.slnx --configuration Release --no-restore
      - name: Test vertical slice
        run: dotnet test ProgramKit.slnx --configuration Release --no-build --no-restore
      - name: Verify formatting
        run: dotnet format ProgramKit.slnx --no-restore --verify-no-changes
      - name: Pack workspace-local CLI
        shell: pwsh
        run: ./eng/Pack-ProgramKitTool.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'program-kit-tool-feed')
      - name: Verify provider-neutral conformance
        run: >-
          dotnet test tests/ProgramKit.AcceptanceTests/ProgramKit.AcceptanceTests.csproj
          --configuration Release --no-build --no-restore
          --filter "CodexProviderConformanceAcceptanceTests|SessionProviderParityAcceptanceTests"
      - name: Verify runtime isolation
        run: >-
          dotnet test tests/ProgramKit.AcceptanceTests/ProgramKit.AcceptanceTests.csproj
          --configuration Release --no-build --no-restore
          --filter "RuntimeAndDriftAcceptanceTests|SessionRuntimeIsolationAcceptanceTests"
      - name: Verify bounded disclosure
        run: >-
          dotnet test tests/ProgramKit.UnitTests/ProgramKit.UnitTests.csproj
          --configuration Release --no-build --no-restore
          --filter SessionDisclosureTests
      - name: Run ten-workspace session quickstart
        shell: pwsh
        run: >-
          ./eng/Invoke-SessionIntegrationQuickstart.ps1
          -SkipBootstrap
          -EvidencePath (Join-Path $env:RUNNER_TEMP 'deterministic-session-review.json')
      - name: Retain deterministic session review evidence
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-session-review-${{ matrix.os }}
          path: ${{ runner.temp }}/deterministic-session-review.json
          if-no-files-found: error
