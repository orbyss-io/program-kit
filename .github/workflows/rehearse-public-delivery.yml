name: Rehearse existing public delivery
on:
  push:
    branches: [codex/public-delivery-prior-preparation]
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
jobs:
  public-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check "specify-cli==1.2.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extensions/program-kit-dotnet/templates/dotnet/files/.nvmrc
      - run: npm install --global "npm@$(cat extensions/program-kit-dotnet/templates/dotnet/files/.npm-version)" --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: extensions/program-kit-dotnet/templates/dotnet/files/global.json
      - name: Build unpublished repair for upgrade rehearsal
        run: python scripts/build_release.py --output artifacts/rehearsal-payload
      - name: Rehearse public installation and unpublished upgrade repair
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys, time
          sys.path.insert(0, 'tests')
          from owned_fixture import FixtureDirectory
          from validate_public_delivery import PublicDelivery, journey
          from release_candidate import require, write
          # Read-only diagnosis, never candidate qualification or publication.
          repo = 'orbyss-io/program-kit'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path], text=True))
          expected_source = 'eff1c189b5b9c03fdf76459b6c68e086d3ed9c38'
          require(api('git/ref/tags/v0.13.3')['object']['sha'] == expected_source, 'Published source changed')
          published = api('releases/tags/v0.13.3')
          require(published['id'] == 415962540 and not published['draft'], 'Published release changed')
          assets = [
              {'name':'Initialize-ProgramKit-0.13.3.sh','size':9822,'sha256':'5d851154f678bddd714670bd54086c92c7e3b8b95a8ed5121c2805a7f8bf87d6'},
              {'name':'program-kit-0.13.3.zip','size':4683521,'sha256':'6fd73e047ba277455b004a7454ad05f63d46fda89c437956fa3c1914159e75c3'}]
          by_name = {a['name']:a for a in published['assets']}
          for asset in assets:
              actual = by_name[asset['name']]
              require(actual['size'] == asset['size'] and actual['digest'] == 'sha256:'+asset['sha256'], 'Public asset changed')
          candidate = pathlib.Path('artifacts/rehearsal-payload/program-kit-0.13.3.zip').resolve()
          candidate_hash = hashlib.sha256(candidate.read_bytes()).hexdigest()
          assets[1] = {'name':candidate.name,'size':candidate.stat().st_size,'sha256':candidate_hash}
          class Rehearsal(PublicDelivery):
              def download(self, url, destination, expected):
                  if destination.name == candidate.name:
                      require(expected == assets[1] and hashlib.sha256(candidate.read_bytes()).hexdigest() == candidate_hash,
                              'Unpublished diagnostic transport changed')
                      shutil.copyfile(candidate, destination)
                      self.remaining()
                  else:
                      super().download(url, destination, expected)
          diagnostics = pathlib.Path('artifacts/public-delivery').resolve()
          session = Rehearsal(diagnostics, 120)
          outcome = 'failed'
          try:
              with FixtureDirectory() as temporary:
                  journey(session,pathlib.Path(temporary),{'source':{'version':'0.13.3'},'assets':assets},'v0.13.2')
              outcome = 'passed'
          finally:
              write(diagnostics/'result.json',{'status':outcome,'publishedInitializerSource':expected_source,
                    'unpublishedCandidateSource':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                    'unpublishedBundleSha256':candidate_hash,
                    'seconds':time.monotonic()-session.started,'budgetSeconds':120,'operations':session.operations,
                    'scope':'existing public initializer, actual prior public consumer, unpublished upgrade repair; no publication or qualification authority'})
          print('Public initializer and unpublished prior-release upgrade rehearsal passed.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-delivery-rehearsal
          path: artifacts/public-delivery/
          retention-days: 14
