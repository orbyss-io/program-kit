name: Publish Program Kit Host Image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: host-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag must equal $expected" >&2; exit 1; }

      - name: Read runtime artifact version
        id: runtime_version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < RUNTIME_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish host image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/dotnet/ProgramKit.Host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/orbyss-io/program-kit-host:${{ steps.runtime_version.outputs.value }}
            ghcr.io/orbyss-io/program-kit-host:sha-${{ github.sha }}

      - name: Write immutable host-image release evidence
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/write_host_image_release_evidence.py \
            --version "$version" \
            --runtime-version "${{ steps.runtime_version.outputs.value }}" \
            --source-commit "$GITHUB_SHA" \
            --digest "${{ steps.build.outputs.digest }}" \
            --output "artifacts/program-kit-host-image-$version.json"
          echo "PROGRAMKIT_HOST_IMAGE=ghcr.io/orbyss-io/program-kit-host@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest host-image release evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/program-kit-host-image-*.json

      - name: Publish host-image evidence with the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset="artifacts/program-kit-host-image-$(tr -d '\r\n' < VERSION).json"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          elif ! gh release create "$GITHUB_REF_NAME" "$asset" \
              --verify-tag \
              --title "Program Kit $GITHUB_REF_NAME" \
              --generate-notes; then
            for attempt in {1..12}; do
              if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
                exit 0
              fi
              sleep 5
            done
            echo "release creation failed and no concurrent release became visible" >&2
            exit 1
          fi
