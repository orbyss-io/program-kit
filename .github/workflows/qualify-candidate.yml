name: Qualify candidate
run-name: Packages ${{ inputs.expected_commit }}
on:
  workflow_call:
    inputs:
      expected_commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit, matching the dispatch source
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: packages-${{ github.workflow }}-${{ inputs.expected_commit }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Assert exact candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python scripts/release_candidate.py assert-main --expected-commit "$EXPECTED_COMMIT"
      - run: python -m pip install --disable-pip-version-check "specify-cli==1.2.3"
      - run: python extensions/program-kit-governance/scripts/schema_runtime.py setup
      - name: Fast integrity
        run: python scripts/run_validation.py --suite Integrity
      - name: Build publication packages once
        run: python scripts/build_release.py
      - name: Bind exact source and publication bytes
        run: python scripts/release_candidate.py snapshot --output artifacts/candidate-payload.json
      - name: Stage publication inventory
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('artifacts')
          target = root / 'payload'
          target.mkdir()
          for record in json.loads((root / 'candidate-payload.json').read_text())['assets']:
              shutil.copyfile(root / record['name'], target / record['name'])
          shutil.copyfile(root / 'candidate-payload.json', target / 'candidate-payload.json')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-${{ github.run_attempt }}
          path: artifacts/payload/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integrity-${{ github.run_attempt }}
          path: artifacts/validation-runs/
          if-no-files-found: warn
          retention-days: 14
  install:
    name: install-${{ matrix.platform }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check "specify-cli==1.2.3"
      - run: python extensions/program-kit-governance/scripts/schema_runtime.py setup
      - name: Import original build artifact
        run: python scripts/release_candidate.py import-payload
      - name: Verify original package bytes
        run: python scripts/release_candidate.py verify-payload --manifest artifacts/payload/candidate-payload.json --directory artifacts/payload
      - name: Install actual packages and invoke installed helpers
        run: python tests/validate_package_smoke.py --assets-dir artifacts/payload
  security:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Import original build artifact
        run: python scripts/release_candidate.py import-payload
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Scan the immutable declared Host dependency
        run: python scripts/release_candidate.py security --payload-manifest artifacts/payload/candidate-payload.json --output artifacts/security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-${{ github.run_attempt }}
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14
  timings:
    if: always()
    needs: [build, install, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Report elapsed time and per-job cost, including failures
        env:
          CI_BUDGET_SECONDS: '600'
        run: python scripts/release_candidate.py timing
