name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact branch commit to check (package CI only)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    uses: ./.github/workflows/qualify-candidate.yml
    with:
      expected_commit: ${{ inputs.expected_commit || github.sha }}
