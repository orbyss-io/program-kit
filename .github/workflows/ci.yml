name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation selection (targeted checks do not qualify publication)
        required: false
        default: full
        type: choice
        options:
          - full
          - qualify_reusable_foundations
          - maintenance-failed-integrations

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Reproduce active maintenance pins for focused integration diagnosis
        if: github.event_name == 'workflow_dispatch' && inputs.validation == 'maintenance-failed-integrations'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dependency_maintenance.py upgrade

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.2.0"

      - name: Prepare project-local JSON Schema runtime
        run: python extensions/program-kit-governance/scripts/schema_runtime.py setup

      - name: Validate Bash initializer and Codex execution boundary
        run: python tests/validate_codex_bootstrap.py

      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Set up pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund

      - name: Set up managed .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: extensions/program-kit-dotnet/templates/dotnet/files/global.json

      - name: Reproduce the upgraded public profile for focused diagnosis
        if: github.event_name == 'workflow_dispatch' && inputs.validation == 'maintenance-failed-integrations'
        env:
          GH_TOKEN: ${{ github.token }}
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm install --global "npm@$(cat extensions/program-kit-dotnet/templates/dotnet/files/.npm-version)" --ignore-scripts --no-audit --no-fund
          python -c "import re, subprocess, sys; from pathlib import Path; pins=set(re.findall(r'specify-cli==([0-9.]+)', Path('.github/workflows/ci.yml').read_text())); assert len(pins)==1; subprocess.run([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', 'specify-cli=='+pins.pop()], check=True)"
          python scripts/update_dependency_profiles.py update --engines=chromium,firefox,webkit

      - name: Run shared deterministic validation inventory
        env:
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_SELECTION: ${{ inputs.validation }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          command = ['python', 'scripts/run_validation.py']
          common = ['--workers', '4', '--engines=chromium,firefox,webkit']
          event = os.environ.get('EVENT_NAME')
          if event == 'pull_request':
              arguments = ['--suite', 'PullRequest', '--changed-from', os.environ['BASE_SHA']]
          elif event == 'workflow_dispatch':
              selection = os.environ.get('VALIDATION_SELECTION') or 'full'
              if selection == 'full':
                  arguments = ['--suite', 'PullRequest']
              elif selection == 'qualify_reusable_foundations':
                  # The maintained runner expands prerequisites; this creates no Release receipt.
                  arguments = ['--check', 'qualify_reusable_foundations']
              elif selection == 'maintenance-failed-integrations':
                  # Each independent failed integration runs even if an earlier one fails.
                  # Existing prerequisites remain enforced; these are diagnostic runs,
                  # never complete qualification or authority to adopt/publish a profile.
                  results = []
                  for check in ('validate_consumer_upgrade_install', 'qualify_reusable_foundations', 'validate_typed_operation'):
                      results.append(subprocess.run(command + ['--check', check] + common).returncode)
                  raise SystemExit(any(results))
              else:
                  raise SystemExit('Unknown manual CI validation selection')
          else:
              arguments = ['--suite', 'PullRequest', '--changed-before', os.environ.get('PUSH_BEFORE', ''), '--changed-to', os.environ['PUSH_AFTER']]
          subprocess.run(command + arguments + common, check=True)
          PY

      - name: Preserve validation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-kit-${{ github.sha }}
          path: |
            artifacts/validation-runs/
            artifacts/tests/toolkit-cases/
            artifacts/t/**/stdout.log
            artifacts/t/**/stderr.log
            artifacts/t/**/process.json
            artifacts/t/**/result.json
            artifacts/t/**/results.json
            artifacts/t/**/authentication.xml
            artifacts/postgresql-lifecycle/**/*.log
            artifacts/postgresql-lifecycle/**/results.json
            artifacts/tests/typed-operation/**/*.log
            artifacts/tests/typed-operation/**/results.json
            artifacts/tests/hosted-palette/**/*.log
            artifacts/tests/hosted-palette/**/result.json
            artifacts/tests/hosted-palette/**/progress.json
            artifacts/tests/hosted-palette/**/phase.json
            artifacts/tests/reusable-foundations/**/*.log
            artifacts/tests/reusable-foundations/**/*.json
            artifacts/bootstrap-postgresql/
            artifacts/consumer-upgrade-package-runs/
            artifacts/dependency-update*.json
            artifacts/profile-update-native/**/*.json
            artifacts/profile-update-native/**/*.log
            artifacts/tests/numeric-schema/**/*.log
            artifacts/tests/schema-role-grants/**/*.log
            artifacts/tests/schema-role-grants/**/operations.json
            artifacts/*.json
            artifacts/*.zip
            artifacts/*.cmd
            artifacts/*.sh
            artifacts/SHA256SUMS
            !artifacts/**/cache/nuget/http/**
          if-no-files-found: warn
          retention-days: 14

  windows-bootstrap:
    # This manual diagnostic mode exercises the remaining Linux integrations.
    # PR/main/full CI and exact-candidate Windows qualification remain unchanged.
    if: github.event_name != 'workflow_dispatch' || inputs.validation != 'maintenance-failed-integrations'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.2.0"

      - name: Validate Python-flavor Codex bootstrap on Windows
        run: python tests/validate_codex_bootstrap.py

      - name: Set up Node for the Windows npm launcher fixture
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Validate automatic Windows workflow PATH preparation
        run: python tests/test_workflow_shell_preflight.py

      - name: Validate scoped worker permissions with fixture subprocesses
        run: python tests/validate_codex_worker_policy.py

      - name: Validate compatibility with unmodified public Spec Kit
        run: python tests/validate_public_core_compatibility.py

      - name: Prepare engine schema runtime and preserve its interpreter
        run: |
          python extensions/program-kit-governance/scripts/schema_runtime.py setup
          python -c "import sys; print('PK_ENGINE_PYTHON=' + sys.executable)" >> $env:GITHUB_ENV

      - name: Validate source installation on Windows
        run: python scripts/run_validation.py --check source-install

      - name: Set up distinct shell Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # This older compatibility runtime must remain distinct from the engine.
          python-version-file: .python-compat-version

      - name: Validate mixed Python workflow run and resume without agents
        # This is a positive native-runtime trial. Missing-dependency rejection
        # remains covered separately by validate_public_core_compatibility.py.
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
          & $env:PK_ENGINE_PYTHON tests/validate_workflow_runtimes.py --mixed-python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            artifacts/validation-runs/
            artifacts/tests/toolkit-cases/
            artifacts/t/**/stdout.log
            artifacts/t/**/stderr.log
            artifacts/t/**/process.json
            artifacts/t/**/result.json
            artifacts/t/**/results.json
            artifacts/t/**/authentication.xml
            artifacts/postgresql-lifecycle/**/*.log
            artifacts/postgresql-lifecycle/**/results.json
            artifacts/tests/typed-operation/**/*.log
            artifacts/tests/typed-operation/**/results.json
            artifacts/tests/hosted-palette/**/*.log
            artifacts/tests/hosted-palette/**/result.json
            artifacts/tests/hosted-palette/**/progress.json
            artifacts/tests/hosted-palette/**/phase.json
            artifacts/tests/reusable-foundations/**/*.log
            artifacts/tests/reusable-foundations/**/*.json
          if-no-files-found: warn
