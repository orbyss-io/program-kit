name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.1.1"

      - name: Prepare project-local JSON Schema runtime
        run: python extensions/program-kit-governance/scripts/schema_runtime.py setup

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"

      - name: Set up pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund

      - name: Set up managed .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: extensions/program-kit-dotnet/templates/dotnet/files/global.json

      - name: Run shared deterministic validation inventory
        env:
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/run_validation.py --suite PullRequest --changed-from "$BASE_SHA" --workers 4 --engines=chromium,firefox,webkit
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/run_validation.py --suite PullRequest --workers 4 --engines=chromium,firefox,webkit
          else
            python scripts/run_validation.py --suite Development --workers 4 --engines=chromium,firefox,webkit
          fi

      - name: Preserve validation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-kit-${{ github.sha }}
          path: |
            artifacts/validation-runs/
            artifacts/bootstrap-postgresql/
            artifacts/*.json
            artifacts/*.zip
            artifacts/*.cmd
            artifacts/*.sh
            artifacts/SHA256SUMS
            !artifacts/**/cache/nuget/http/**
          if-no-files-found: warn
          retention-days: 14

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.1.1"

      - name: Validate Python-flavor Codex bootstrap on Windows
        run: python tests/validate_codex_bootstrap.py

      - name: Validate scoped worker permissions with fixture subprocesses
        run: python tests/validate_codex_worker_policy.py

      - name: Validate compatibility with unmodified public Spec Kit
        run: python tests/validate_public_core_compatibility.py

      - name: Prepare engine schema runtime and preserve its interpreter
        run: |
          python extensions/program-kit-governance/scripts/schema_runtime.py setup
          python -c "import sys; print('PK_ENGINE_PYTHON=' + sys.executable)" >> $env:GITHUB_ENV

      - name: Validate source installation on Windows
        run: python scripts/run_validation.py --check source-install

      - name: Set up distinct shell Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # This older compatibility runtime must remain distinct from the engine.
          python-version-file: .python-compat-version

      - name: Validate mixed Python workflow run and resume without agents
        # This is a positive native-runtime trial. Missing-dependency rejection
        # remains covered separately by validate_public_core_compatibility.py.
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
          & $env:PK_ENGINE_PYTHON tests/validate_workflow_runtimes.py --mixed-python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-${{ github.sha }}
          path: artifacts/validation-runs/
          if-no-files-found: warn
