name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.0.1"

      - name: Prepare project-local JSON Schema runtime
        run: python extensions/program-kit-governance/scripts/schema_runtime.py setup

      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"

      - name: Set up pinned npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund

      - name: Set up managed .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: extensions/program-kit-dotnet/templates/dotnet/files/global.json

      - name: Run shared deterministic validation inventory
        env:
          PROGRAM_KIT_NPM_TOKEN: ${{ github.token }}
        run: python scripts/run_validation.py --suite Release --approved --engines=chromium,firefox,webkit

      - name: Preserve validation evidence on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program-kit-${{ github.sha }}
          path: |
            artifacts/validation-runs/
            artifacts/*.json
            artifacts/*.zip
            artifacts/*.cmd
            artifacts/*.sh
            artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Spec Kit
        run: python -m pip install --disable-pip-version-check "specify-cli==1.0.1"

      - name: Validate Python-flavor Codex bootstrap on Windows
        run: python tests/validate_codex_bootstrap.py

      - name: Prepare engine schema runtime and preserve its interpreter
        run: |
          python extensions/program-kit-governance/scripts/schema_runtime.py setup
          python -c "import sys; print('PK_ENGINE_PYTHON=' + sys.executable)" >> $env:GITHUB_ENV

      - name: Validate source installation on Windows
        run: python scripts/run_validation.py --check source-install

      - name: Set up distinct shell Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate mixed Python workflow run and resume without agents
        run: |
          & $env:PK_ENGINE_PYTHON tests/validate_workflow_runtimes.py --mixed-python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
