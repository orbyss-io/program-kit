schema_version: "1.0"

workflow:
  id: "program-kit-bootstrap"
  name: "Architecture-Governed Repository Bootstrap"
  version: "0.4.2"
  author: "Orbyss"
  description: "Ratifies project governance, then builds architecture, quality, and the candidate specification portfolio."

requires:
  speckit_version: ">=1.0.1,<2.0.0"

inputs:
  initial_design:
    type: string
    required: true
    prompt: "Path to the user-provided initial design"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto inherits the initialized project integration"
  assessment_verdict:
    type: string
    default: ""
  constitution_verdict:
    type: string
    default: ""
  bootstrap_verdict:
    type: string
    default: ""

steps:
  - id: codex-execution-preflight
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/codex_bootstrap_preflight.py --integration auto --json"
    output_format: json

  - id: codex-execution-boundary
    type: switch
    expression: "{{ steps.codex-execution-preflight.output.data.action }}"
    cases:
      blocked:
        - id: nested-codex-unsupported
          type: command
          command: "PROGRAM_KIT_CODEX_NESTED_SANDBOX: Spec Kit 1.0.1 would start a nested Codex CLI inside Codex Desktop's native Windows elevated sandbox, where Codex home/state and app-server initialization are unavailable. Rerun the outer command outside the sandbox and approve only the exact prefix 'specify workflow run program-kit-bootstrap', or run it from ordinary PowerShell. Keep resume prompted for every human gate. Do not weaken the sandbox or expose .codex state. See .specify/extensions/program-kit-governance/references/codex-desktop-windows.md"
          integration: "program-kit-preflight-diagnostic"

  - id: intake
    type: command
    command: "speckit.program-kit-governance.intake"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: research
    type: command
    command: "speckit.program-kit-governance.research"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: review-assessment
    type: gate
    message: "Review the design inventory, unresolved decisions, and researched capability recommendations. Approve before constitution drafting."
    show_file: "docs/architecture/bootstrap-assessment.md"
    options: [approve, reject]
    on_reject: abort
    verdict_input: "assessment_verdict"

  - id: constitution-begin
    type: command
    command: "speckit.program-kit-governance.constitution-begin"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: constitution-draft
    type: command
    command: "speckit.constitution"
    integration: "{{ inputs.integration }}"
    input:
      args: "Draft or update the project constitution from {{ inputs.initial_design }} and docs/architecture/bootstrap-assessment.md. Treat it as the highest project governance artifact, not a feature specification. Preserve applicable amendments and produce explicit semantic version, ratification date, last-amended date, amendment procedure, and compliance governance. Do not claim human ratification."

  - id: review-constitution
    type: gate
    message: "Review the complete project constitution. Ratify only when it contains no template placeholders or TODOs and its principles, semantic version, dates, amendment procedure, and compliance governance are acceptable."
    show_file: ".specify/memory/constitution.md"
    options: [ratify, reject]
    on_reject: abort
    verdict_input: "constitution_verdict"

  - id: constitution-ratify
    type: command
    command: "speckit.program-kit-governance.constitution-ratify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.constitution_verdict }}"

  - id: architecture
    type: command
    command: "speckit.program-kit-governance.architecture"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: tooling
    type: command
    command: "speckit.program-kit-governance.tooling"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: specification-roadmap
    type: command
    command: "speckit.program-kit-governance.roadmap"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: review-bootstrap
    type: gate
    message: "Review the ratified constitution evidence, architecture baseline, Proposed ADRs, technology statuses, quality system, candidate specification roadmap, and first design-task sequence."
    show_file: "docs/architecture/architecture.md"
    options: [approve, reject]
    on_reject: abort
    verdict_input: "bootstrap_verdict"

  - id: readiness
    type: command
    command: "speckit.program-kit-governance.readiness"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"
