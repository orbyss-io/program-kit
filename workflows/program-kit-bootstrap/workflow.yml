schema_version: "1.0"

workflow:
  id: "program-kit-bootstrap"
  name: "Architecture-Governed Repository Bootstrap"
  version: "0.11.0"
  author: "Orbyss"
  description: "Consumes a confirmed conversational intake and orchestrates Program Kit assessment, ratification, architecture, quality, and the candidate specification portfolio."

requires:
  speckit_version: ">=1.0.1,<2.0.0"

inputs:
  bootstrap_intake:
    type: string
    required: true
    prompt: "Path to the confirmed Program Kit bootstrap intake"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto inherits the initialized project integration"
  auto_approve_and_ratify:
    type: boolean
    default: false
    prompt: "Automatically approve all generated review packets and ratify the constitution"
  assessment_verdict:
    type: string
    default: ""
  constitution_verdict:
    type: string
    default: ""
  bootstrap_verdict:
    type: string
    default: ""

steps:
  - id: codex-execution-preflight
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/codex_bootstrap_preflight.py --integration auto --run-id {{ context.run_id }} --json"
    output_format: json

  - id: codex-execution-boundary
    type: switch
    expression: "{{ steps.codex-execution-preflight.output.data.action }}"
    cases:
      agent-boundary-blocked:
        - id: confirm-agent-boundary-stop
          type: gate
          message: "Preflight stop (not a review gate). {{ steps.codex-execution-preflight.output.data.diagnostic }}"
          options: [abort]
          on_reject: abort
      script-runtime-blocked:
        - id: confirm-script-runtime-stop
          type: gate
          message: "Preflight stop (not a review gate). {{ steps.codex-execution-preflight.output.data.diagnostic }}"
          options: [abort]
          on_reject: abort
      git-worktree-blocked:
        - id: confirm-git-worktree-stop
          type: gate
          message: "Preflight stop (not a review gate). {{ steps.codex-execution-preflight.output.data.diagnostic }}"
          options: [abort]
          on_reject: abort
      concurrent-run-blocked:
        - id: confirm-concurrent-run-stop
          type: gate
          message: "Preflight stop (not a review gate). {{ steps.codex-execution-preflight.output.data.diagnostic }}"
          options: [abort]
          on_reject: abort
      run-state-blocked:
        - id: confirm-run-state-stop
          type: gate
          message: "Preflight stop (not a review gate). {{ steps.codex-execution-preflight.output.data.diagnostic }}"
          options: [abort]
          on_reject: abort

  - id: prepare-utf8-runtime
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/ensure_utf8.py --target ."

  - id: validate-bootstrap-intake
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_intake.py validate-run --run-id {{ context.run_id }} --json"
    output_format: json

  - id: prepare-assessment-context
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py build --stage assessment --run-id {{ context.run_id }} --json"
    output_format: json

  - id: assessment
    type: command
    command: "speckit.program-kit-governance.assessment"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ steps.validate-bootstrap-intake.output.data.path }}; bootstrap context: {{ steps.prepare-assessment-context.output.data.path }}"

  - id: validate-assessment-output
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-output --stage assessment --json"
    output_format: json

  - id: prepare-research-context
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py build --stage research --run-id {{ context.run_id }} --json"
    output_format: json

  - id: research
    type: command
    command: "speckit.program-kit-governance.research"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.bootstrap_intake }}; bootstrap context: {{ steps.prepare-research-context.output.data.path }}"

  - id: validate-research-output
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-output --stage research --json"
    output_format: json

  - id: validate-profile-pins
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-profile-pins --run-id {{ context.run_id }} --json"
    output_format: json

  - id: validate-assessment
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-assessment"

  - id: write-assessment-review
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py write-review --stage assessment"

  - id: route-assessment-approval
    type: switch
    expression: "{{ inputs.auto_approve_and_ratify }}"
    cases:
      true:
        - id: auto-accept-assessment
          type: shell
          run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py accept-assessment --verdict approve --approval-mode automatic"
    default:
      - id: review-assessment
        type: gate
        message: "Gate 1/3 — Assessment approval. Review the concise packet listing every file and summarizing explicit intake choices, applied Program Kit defaults, overrides, acknowledgements, genuinely unresolved decisions, and deferred triggers. To open the C4 diagrams, ask 'View the C4 projection' or invoke $speckit-program-kit-governance-view-c4; Program Kit validates freshness and uses a temporary localhost viewer without changing the canonical map. Approve to adopt this exact provisional baseline. Reject keeps the run paused so the artifacts and packet can be revised and regenerated."
        show_file: "docs/architecture/reviews/assessment-review.md"
        options: [approve, reject]
        on_reject: retry
        verdict_input: "assessment_verdict"
      - id: accept-assessment
        type: shell
        run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py accept-assessment --verdict \"{{ steps.review-assessment.output.choice }}\" --approval-mode interactive"

  - id: constitution-draft
    type: command
    command: "speckit.constitution"
    integration: "{{ inputs.integration }}"
    input:
      args: "Draft or update the project constitution from the confirmed {{ inputs.bootstrap_intake }}, docs/architecture/bootstrap-assessment.md, and the approved docs/architecture/bootstrap-decisions.json. Treat it as the highest project governance artifact, not a feature specification. Preserve applicable amendments. Explicit intake choices and reviewed Program Kit defaults are adopted baseline authority, not Proposed technologies. Use repository maintainers as the default governance owner unless intake names another owner. Produce an exact '**Status**: Draft' line, semantic version, last-amended date, amendment procedure, versioning policy, and compliance governance. For an initial constitution use the exact metadata value '**Ratified**: PENDING_RATIFICATION'; for an amendment preserve the original valid ratification date. When replacing the initial scaffold, use exactly one `*** Update File` operation that replaces its contents; never use Delete File plus Add File or submit multiple patch operations targeting constitution.md. For a simple single-interface project, compose the first complete draft at no more than 5,500 UTF-8 bytes; do not write an oversized draft and trim it in later turns. Keep principles enforceable and compact, omit rationale essays and duplicated baseline inventories, and never exceed the 6 KiB hard boundary. Use one targeted read batch and one whole-file write. The mandatory after hook owns deterministic validation and review generation: copy its two commands exactly in one shell batch, including `write-review --stage constitution`; do not invent a `review` subcommand, omit the stage argument, or add ad hoc byte, regex, diff, or repository scans. When the required hook succeeds, stop immediately and report the path and final byte count. Do not print the document or a full diff. Do not add TODOs or claim that the Draft is already human-ratified."

  - id: validate-constitution-draft
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-constitution-draft"

  - id: write-constitution-review
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py write-review --stage constitution"

  - id: route-constitution-ratification
    type: switch
    expression: "{{ inputs.auto_approve_and_ratify }}"
    cases:
      true:
        - id: auto-ratify-constitution
          type: shell
          run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py ratify --verdict ratify --approval-mode automatic"
    default:
      - id: review-constitution
        type: gate
        message: "Gate 2/3 — Constitution ratification. Review the constitution file named in this concise packet. Ratification will deterministically change only Draft status and the initial pending ratification date, then hash-bind the exact final content. Reject keeps the run paused for revision and packet regeneration."
        show_file: "docs/architecture/reviews/constitution-review.md"
        options: [ratify, reject]
        on_reject: retry
        verdict_input: "constitution_verdict"
      - id: constitution-ratify
        type: shell
        run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py ratify --verdict \"{{ steps.review-constitution.output.choice }}\" --approval-mode interactive"

  - id: prepare-architecture-context
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py build --stage architecture --run-id {{ context.run_id }} --json"
    output_format: json

  # This step records process dispatch only. The following deterministic gate owns completion.
  - id: architecture-dispatch
    type: command
    command: "speckit.program-kit-governance.architecture"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.bootstrap_intake }}; bootstrap context: {{ steps.prepare-architecture-context.output.data.path }}"

  - id: validate-architecture-output
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-stage --stage architecture --run-id {{ context.run_id }} --json"
    output_format: json

  - id: validate-architecture-alignment
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-architecture-alignment --run-id {{ context.run_id }} --json"
    output_format: json

  - id: prepare-tooling-context
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py build --stage tooling --run-id {{ context.run_id }} --json"
    output_format: json

  - id: tooling
    type: command
    command: "speckit.program-kit-governance.tooling"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.bootstrap_intake }}; bootstrap context: {{ steps.prepare-tooling-context.output.data.path }}"

  - id: validate-tooling-output
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-output --stage tooling --json"
    output_format: json

  - id: prepare-roadmap-context
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py build --stage roadmap --run-id {{ context.run_id }} --json"
    output_format: json

  - id: specification-roadmap
    type: command
    command: "speckit.program-kit-governance.roadmap"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.bootstrap_intake }}; bootstrap context: {{ steps.prepare-roadmap-context.output.data.path }}"

  - id: validate-roadmap-output
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-stage --stage roadmap --run-id {{ context.run_id }} --json"
    output_format: json

  - id: architecture-prerequisite-closure
    type: command
    command: "speckit.program-kit-governance.bootstrap-closure"
    integration: "{{ inputs.integration }}"
    input:
      args: "Use the existing approved assessment and generated architecture/roadmap. Inventory and disposition prerequisite sources, run bounded isolated compatibility recipes for architecture dependencies of the intended first slice, then regenerate the roadmap eligibility and lifecycle projections. Do not alter approved intake or assessment. Unresolved architecture dependencies keep their affected entries Blocked."

  - id: validate-prerequisite-closure
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-prerequisites"

  - id: synchronize-lifecycle
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py synchronize-lifecycle"

  - id: synchronize-roadmap
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py synchronize-roadmap"

  - id: validate-bootstrap-consistency
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-bootstrap-consistency"

  - id: validate-bootstrap
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-bootstrap"

  - id: write-bootstrap-review
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py write-review --stage bootstrap"

  - id: route-bootstrap-approval
    type: switch
    expression: "{{ inputs.auto_approve_and_ratify }}"
    cases:
      true:
        - id: auto-accept-bootstrap
          type: shell
          run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py accept-bootstrap --verdict approve --approval-mode automatic"
    default:
      - id: review-bootstrap
        type: gate
        message: "Gate 3/3 — Final bootstrap approval. Review the packet, every listed artifact, the founding and scoped follow-on ADR bundle, prerequisite evidence/dispositions, and exact map acceptance scope. To open the diagrams, ask 'View the C4 projection' or invoke $speckit-program-kit-governance-view-c4. Approval promotes only listed Proposed decisions and scoped map semantics, refreshes deterministic lifecycle views and DSL, and accepts the reviewed selection. Unrelated proposals stay Proposed. Acceptance does not substitute for compatibility proof. Reject keeps the run paused for revision and packet regeneration."
        show_file: "docs/architecture/reviews/bootstrap-review.md"
        options: [approve, reject]
        on_reject: retry
        verdict_input: "bootstrap_verdict"
      - id: accept-bootstrap
        type: shell
        run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py accept-bootstrap --verdict \"{{ steps.review-bootstrap.output.choice }}\" --approval-mode interactive"

  - id: prepare-readiness-context
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py build --stage readiness --run-id {{ context.run_id }} --json"
    output_format: json

  - id: readiness
    type: command
    command: "speckit.program-kit-governance.readiness"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.bootstrap_intake }}; bootstrap context: {{ steps.prepare-readiness-context.output.data.path }}"

  - id: validate-readiness-output
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/bootstrap_context.py validate-stage --stage readiness --run-id {{ context.run_id }} --json"
    output_format: json

  # A non-ready assessment is preserved and stops at a recoverable shell failure.
  # No gate translates technical remediation into a human rejection.
  - id: require-readiness
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py require-readiness"

  - id: complete-bootstrap
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py complete-bootstrap"
