schema_version: "1.0"

workflow:
  id: "program-kit-bootstrap"
  name: "Architecture-Governed Repository Bootstrap"
  version: "0.6.2"
  author: "Orbyss"
  description: "Orchestrates the Program Kit bundle's governance extension through ratification, architecture, quality, and the candidate specification portfolio."

requires:
  speckit_version: ">=1.0.1,<2.0.0"

inputs:
  initial_design:
    type: string
    required: true
    prompt: "Path to the user-provided initial design"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto inherits the initialized project integration"
  assessment_verdict:
    type: string
    default: ""
  constitution_verdict:
    type: string
    default: ""
  bootstrap_verdict:
    type: string
    default: ""

steps:
  - id: codex-execution-preflight
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/codex_bootstrap_preflight.py --integration auto --json"
    output_format: json

  - id: codex-execution-boundary
    type: switch
    expression: "{{ steps.codex-execution-preflight.output.data.action }}"
    cases:
      agent-boundary-blocked:
        - id: nested-codex-unsupported
          type: command
          command: "PROGRAM_KIT_CODEX_AGENT_BOUNDARY: Program Kit stopped because a Codex Desktop task or interactive Codex CLI agent started the outer workflow. Open a normal user-owned PowerShell or WSL terminal yourself and run 'specify workflow run program-kit-bootstrap ...' there. Do not ask the agent to execute it outside its sandbox or install an approval rule. If an agent performed initialization or setup, rerunning init alone may not repair ownership of .agents or .specify. See .specify/extensions/program-kit-governance/references/codex-desktop-windows.md"
          integration: "program-kit-preflight-diagnostic"
      script-runtime-blocked:
        - id: unusable-spec-kit-script-runtime
          type: command
          command: "PROGRAM_KIT_SPEC_KIT_SCRIPT_RUNTIME: Program Kit stopped before intake or research because the resolver referenced by .agents/skills/speckit-constitution/SKILL.md is missing or cannot execute on Windows. From a normal user-owned PowerShell terminal, run 'specify init . --force --non-interactive --integration codex --script py', then confirm .specify/scripts/python/resolve_template.py exists and the constitution skill references it. Do not weaken execution policy, broadly unblock repository files, or grant unrestricted execution. See .specify/extensions/program-kit-governance/references/codex-desktop-windows.md"
          integration: "program-kit-preflight-diagnostic"

  - id: intake
    type: command
    command: "speckit.program-kit-governance.intake"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: research
    type: command
    command: "speckit.program-kit-governance.research"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: validate-assessment
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-assessment"

  - id: write-assessment-review
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py write-review --stage assessment"

  - id: review-assessment
    type: gate
    message: "Gate 1/3 — Assessment approval. Review the concise packet listing every file and summarizing explicit intake choices, applied Program Kit defaults, overrides, acknowledgements, genuinely unresolved decisions, and deferred triggers. Approve to adopt this exact provisional baseline. Reject keeps the run paused so the artifacts and packet can be revised and regenerated."
    show_file: "docs/architecture/reviews/assessment-review.md"
    options: [approve, reject]
    on_reject: retry
    verdict_input: "assessment_verdict"

  - id: accept-assessment
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py accept-assessment --verdict \"{{ steps.review-assessment.output.choice }}\""

  - id: constitution-draft
    type: command
    command: "speckit.constitution"
    integration: "{{ inputs.integration }}"
    input:
      args: "Draft or update the project constitution from {{ inputs.initial_design }}, docs/architecture/bootstrap-assessment.md, and the approved docs/architecture/bootstrap-decisions.json. Treat it as the highest project governance artifact, not a feature specification. Preserve applicable amendments. Explicit intake choices and reviewed Program Kit defaults are adopted baseline authority, not Proposed technologies. Use repository maintainers as the default governance owner unless intake names another owner. Produce an exact '**Status**: Draft' line, semantic version, last-amended date, amendment procedure, versioning policy, and compliance governance. For an initial constitution use the exact metadata value '**Ratified**: PENDING_RATIFICATION'; for an amendment preserve the original valid ratification date. Do not add TODOs or claim that the Draft is already human-ratified."

  - id: validate-constitution-draft
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-constitution-draft"

  - id: write-constitution-review
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py write-review --stage constitution"

  - id: review-constitution
    type: gate
    message: "Gate 2/3 — Constitution ratification. Review the constitution file named in this concise packet. Ratification will deterministically change only Draft status and the initial pending ratification date, then hash-bind the exact final content. Reject keeps the run paused for revision and packet regeneration."
    show_file: "docs/architecture/reviews/constitution-review.md"
    options: [ratify, reject]
    on_reject: retry
    verdict_input: "constitution_verdict"

  - id: constitution-ratify
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py ratify --verdict \"{{ steps.review-constitution.output.choice }}\""

  - id: architecture
    type: command
    command: "speckit.program-kit-governance.architecture"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: tooling
    type: command
    command: "speckit.program-kit-governance.tooling"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: specification-roadmap
    type: command
    command: "speckit.program-kit-governance.roadmap"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: validate-bootstrap
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py validate-bootstrap"

  - id: write-bootstrap-review
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py write-review --stage bootstrap"

  - id: review-bootstrap
    type: gate
    message: "Gate 3/3 — Final bootstrap approval. Review the concise packet and every listed artifact. Approval accepts the generated baseline and reviewed defaults but does not promote separately Proposed ADRs. Reject keeps the run paused for revision and packet regeneration."
    show_file: "docs/architecture/reviews/bootstrap-review.md"
    options: [approve, reject]
    on_reject: retry
    verdict_input: "bootstrap_verdict"

  - id: accept-bootstrap
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py accept-bootstrap --verdict \"{{ steps.review-bootstrap.output.choice }}\""

  - id: readiness
    type: command
    command: "speckit.program-kit-governance.readiness"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.initial_design }}"

  - id: complete-bootstrap
    type: shell
    run: "python .specify/extensions/program-kit-governance/scripts/governance_state.py complete-bootstrap"
