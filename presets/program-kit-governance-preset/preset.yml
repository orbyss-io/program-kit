schema_version: "1.0"

preset:
  id: "program-kit-governance-preset"
  name: "Program Kit Governance Templates"
  version: "0.14.1"
  description: "Adds focused implementation, phase-specific guidance and architecture traceability to the standard Spec Kit flow."
  author: "Orbyss"
  repository: "https://github.com/orbyss-io/program-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.1.1,<2.0.0"

provides:
  templates:
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      strategy: "replace"
      replaces: "speckit.tasks"
      description: "Generate operation-sized outcomes with scoped prerequisites and resumable drafting."
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "replace"
      replaces: "speckit.implement"
      description: "Deliver runnable stories with risk-selected verification and persistent human review."
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      strategy: "append"
      description: "Analyze exact operation dependencies while retaining upstream read-only analysis and hooks."
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-governance.md"
      strategy: "append"
      description: "Establish balanced verification, story review, advisory effort and independent engineering."
    - type: "template"
      name: "spec-template"
      file: "templates/spec-governance.md"
      strategy: "append"
      description: "Append governed portfolio and architecture traceability to feature specifications."
    - type: "template"
      name: "plan-template"
      file: "templates/plan-governance.md"
      strategy: "append"
      description: "Append architecture realization evidence to implementation plans."
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-governance.md"
      strategy: "replace"
      replaces: "tasks-template"
      description: "Plan operation-sized outcomes and exact prerequisites without a blanket foundation barrier."

tags:
  - "governance"
  - "architecture"
  - "vertical-slicing"
  - "templates"
