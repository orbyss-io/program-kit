schema_version: "1.0"

bundle:
  id: "program-kit"
  name: "Program Kit"
  version: "1.0.0-preview.1"
  role: "architecture-governed-development"
  description: "Guides product intake, founding decisions and modular, vertically sliced Spec Kit delivery through installed skills and scripts."
  author: "Orbyss"
  license: "MIT"

requires:
  speckit_version: ">=1.1.1,<2.0.0"

provides:
  extensions:
    - id: "program-kit-governance"
      version: "1.0.0-preview.1"
    - id: "program-kit-building-blocks"
      version: "1.0.0-preview.1"
    - id: "program-kit-dotnet"
      version: "1.0.0-preview.1"
  presets:
    - id: "program-kit-governance-preset"
      version: "1.0.0-preview.1"
      priority: 10
      strategy: "append"

tags:
  - "architecture"
  - "adr"
  - "governance"
  - "bootstrap"
  - "spec-driven-development"
  - "vertical-slicing"
  - "modularity"
